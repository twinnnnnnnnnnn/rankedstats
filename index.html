<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;isolation:isolate;position:relative;min-height:100vh}
/* Solid dark background by default. */

@keyframes ambientGradient{0%{background-position:0% 50%}25%{background-position:50% 100%}50%{background-position:100% 50%}75%{background-position:50% 0%}100%{background-position:0% 50%}}
/* Rank-tinted profile backgrounds; special profiles retain their own artwork. */
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
nav{display:flex;align-items:center;gap:12px;padding:6px 0 22px;flex-wrap:wrap}
.settings-wrap{position:relative;margin-left:auto;flex:none}.settings-toggle{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:9px;font-size:18px;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:0 2px 8px #00000012}.settings-toggle:hover{border-color:var(--accent2)}.settings-panel{display:none;position:absolute;right:0;top:43px;z-index:90;width:260px;max-width:calc(100vw - 32px);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:0 12px 36px #0005}.settings-wrap.open .settings-panel{display:grid;gap:12px}.settings-title{font-size:14px;font-weight:750;margin:0 0 2px}.setting-field{display:grid;gap:5px}.setting-field label{font-size:12px;color:var(--muted)}.setting-field select{width:100%;padding:9px 10px}
body.font-minecraft,body.font-minecraft button,body.font-minecraft input,body.font-minecraft select{font-family:"Press Start 2P",monospace!important}body.font-minecraft{font-size:15px}body.font-minecraft h1{font-size:20px;letter-spacing:0}body.font-minecraft td,body.font-minecraft th{font-size:10px}
.logo{margin-right:auto;display:flex;align-items:center;position:relative;isolation:isolate}.logo img{width:58px;height:58px;border-radius:10px;image-rendering:pixelated;display:block;transition:transform .15s}.logo:hover img{transform:scale(1.06)}
form{display:flex;gap:8px}

button{cursor:pointer}
button.go{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-weight:600}
.tabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:calc(var(--r)*.7)}

.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ri{vertical-align:middle;object-fit:contain;flex:none;image-rendering:pixelated}
.who{display:inline-flex;align-items:center;gap:6px}.supporter-name{background:linear-gradient(90deg,#fff0a6,#ffc928,#fff4bd,#d99a00,#fff0a6);background-size:220% 100%;animation:supporterGold 3.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}.supporter-pick{display:inline-block;color:#f4c542;font-size:1.02em;line-height:1;filter:drop-shadow(0 0 4px rgba(255,190,35,.35));vertical-align:-.04em}.hero h1 .supporter-name{display:inline-block}@keyframes supporterGold{to{background-position:220% 0}}@media(prefers-reduced-motion:reduce){.supporter-name{animation:none}}.head{width:40px;height:40px;border-radius:5px;object-fit:contain;image-rendering:auto;flex:none;background:var(--surface2)}

@keyframes lyxierVignette{from{opacity:.68}to{opacity:1}}
@keyframes lyxierPulse{0%,100%{box-shadow:0 0 16px rgba(160,0,25,.18),inset 0 0 22px rgba(90,0,15,.18)}50%{box-shadow:0 0 32px rgba(180,5,27,.42),inset 0 0 30px rgba(125,0,20,.28)}}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:calc(var(--r)*1.15);padding:24px}
.avatar{width:84px;height:84px;border-radius:calc(var(--r)*.9);object-fit:contain;image-rendering:auto;background:var(--surface2)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.elo{text-align:right}

.hero h1 .profile-username.t-diamond{background-image:linear-gradient(90deg,#4fb8ff,#2ee6d6,#87ceeb,#1fd1c4,#4fb8ff)}
.hero h1 .profile-username.t-emerald{background-image:linear-gradient(90deg,#b6ff3b,#12d67a,#7dff6b,#0fbf6d,#b6ff3b)}
.hero h1 .profile-username.t-gold{background-image:linear-gradient(90deg,#ffe14a,#f5a800,#fff08a,#e69500,#ffe14a)}
.hero h1 .profile-username.t-iron{background-image:linear-gradient(90deg,#c9ced8,#f4f6fa,#9aa3b2,#e2e6ee,#c9ced8)}
.hero h1 .profile-username.t-coal{animation:none;background-image:linear-gradient(90deg,#5c616c,#7d828d,#4a4e57,#5c616c)}
@media(prefers-reduced-motion:reduce){.hero h1 .profile-username{animation:none}}
.elo .n.t-netherite{background-image:linear-gradient(90deg,#9b4dff,#ff3df0,#c084fc,#7b2cff,#9b4dff)}
.elo .n.t-diamond{background-image:linear-gradient(90deg,#4fb8ff,#2ee6d6,#87ceeb,#1fd1c4,#4fb8ff)}
.elo .n.t-emerald{background-image:linear-gradient(90deg,#b6ff3b,#12d67a,#7dff6b,#0fbf6d,#b6ff3b)}
.elo .n.t-gold{background-image:linear-gradient(90deg,#ffe14a,#f5a800,#fff08a,#e69500,#ffe14a)}
.elo .n.t-iron{background-image:linear-gradient(90deg,#c9ced8,#f4f6fa,#9aa3b2,#e2e6ee,#c9ced8)}
.elo .n.t-coal{background-image:linear-gradient(90deg,#5c616c,#7d828d,#4a4e57,#5c616c);animation:none}
@media(prefers-reduced-motion:reduce){.elo .n{animation:none}}
.pill b{color:var(--text);font-weight:600}.pill{cursor:default}
.bar{display:flex;gap:12px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.bar .seg{flex:1;max-width:340px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.seg button{width:100%;min-width:0;white-space:nowrap}
.social-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.social-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;cursor:pointer;max-width:100%}

ter}#modal.vod-expanded .vod-heading{position:fixed;top:12px;left:16px;z-index:11}#modal.vod-expanded .vod-heading h3{display:none}

function buildPoints(list,u){
  // API changes[].eloRate is the post-match Elo. Never reconstruct a whole
  // season backward from today's Elo: that fabricates huge historical values.
  const ordered=list.slice().sort((a,b)=>Number(a.date||0)-Number(b.date||0));
  const entries=ordered.map(m=>({m,c:me(m,u.uuid)})).filter(x=>x.c);
  const valid=v=>v!==null&&v!==undefined&&Number.isFinite(Number(v));
  const points=[];
  for(let i=0;i<entries.length;i++){
    const {m,c}=entries[i];
    if(!valid(c.eloRate))continue; // placement matches have no known Elo
    const elo=Number(c.eloRate);
    const delta=valid(c.change)?Number(c.change):null;
    // Only connect points within a consistent API-reported Elo series.
    // No fabricated current-Elo anchor or backward cumulative summing.
    if(!points.length){
      if(delta!==null)points.push({base:true,elo:elo-delta});
      else points.push({base:true,elo});
    }
    const before=delta!==null?elo-delta:(points.at(-1)?.elo??elo);
    points.push({id:m.id,m,elo,before});
  }
  return points;
}
function refreshGraph(){
  if(!P||!P.st||P.mode!=="ranked"||!$("gArea"))return;

  ga.innerHTML='<div class="chartbox" id="cb"></div><div id="detail">Click a point on the graph to inspect that match.</div>';
  chart();if(sel!=null)showDetail(sel);
}

function seekVodTimeline(seconds){

function updateVodTimeline(forced){
  const bar=$("modal").querySelector(".vod-timeline-track");
  if(!bar)return;
  let seconds=forced;
  if(seconds==null){
    const entry=[...vodPlayers.values()].find(v=>v.ready);
    if(!entry)return;
    try{seconds=Math.max(0,entry.player.getCurrentTime()-entry.base-10)}catch(e){return}
  }
  const max=Number(bar.max)||1;
  bar.value=Math.min(max,Math.max(0,seconds));
  const fmtClock=n=>Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0");
  const label=$("modal").querySelector("[data-vod-clock]");
  if(label)label.textContent=fmtClock(seconds)+" / "+fmtClock(max);
  const race=$("modal").querySelector(".vod-race");
  if(race){
    try{
      const data=JSON.parse($("modal").querySelector(".vod-race-data").textContent);
      const count=data[0]?.length||0,total=Number(race.dataset.raceTotal)||max;
      race.querySelectorAll("[data-race-head]").forEach(head=>{
        const row=data[Number(head.dataset.raceHead)]||[];
        let stage=0,previous=0;
        for(let i=0;i<row.length;i++){
          if(row[i]!=null&&seconds>=row[i]){stage=i+1;previous=row[i]}
        }
        let nextIndex=-1;
        for(let i=stage;i<row.length;i++)if(row[i]!=null&&row[i]>seconds){nextIndex=i;break}
        const nextTime=nextIndex>=0?row[nextIndex]:total;
        const targetStage=nextIndex>=0?nextIndex+1:count+1;
        const fraction=Math.max(0,Math.min(1,(seconds-previous)/Math.max(1,nextTime-previous)));
        const progress=(stage+(targetStage-stage)*fraction)/(count+1)*100;
        head.style.left=Math.min(100,Math.max(0,progress))+"%";
      });
    }catch(e){}
  }
}

function renderPT(){
  const el=$("ptab");if(!el)return;
  const v=T.view==="all"?"all":"season",names=shownNames(),rows=names.map(n=>RC[n.toLowerCase()]).filter(Boolean).filter(r=>!T.country||r.country===T.country);
  const k=T.sort.k,d=T.sort.d;
  const val=r=>{if(r.state!=="d")return null;if(k==="name")return r.name;if(k==="elo")return r.elo;const s=r[v];return s&&s[k]!=null?s[k]:null};
  const boardRanks=new Map();
  (T.lb?.users||[]).forEach((u,i)=>{
    const group=mergedPlayerGroup(u.nickname),key=(group?group.primary:u.nickname).toLowerCase(),entry={i,elo:u.seasonResult?.eloRate??u.eloRate,primary:!group||u.nickname.toLowerCase()===group.primary.toLowerCase()};
    const old=boardRanks.get(key);if(!old||entry.primary||!old.primary)boardRanks.set(key,entry);
  });
  const sorted=rows.slice().sort((a,b)=>{if(k==="elo"&&v==="season"){const x=boardRanks.get(a.name.toLowerCase()),y=boardRanks.get(b.name.toLowerCase());return d*((x?.elo??-Infinity)-(y?.elo??-Infinity))||(x?.i??0)-(y?.i??0)}const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==="string")return d*x.localeCompare(y);return d*(x-y)});
  const lead=key=>{const a=rows.map(r=>r[v]&&r[v][key]).filter(x=>x!=null&&x>0);return a.length?Math.min(...a):null};
  const bpb=lead("pb"),bavg=lead("avg");
  const cols=[["name","Player",""],["elo","Elo","num"],["wr","Win rate","num"],["games","Matches","num"],["wins","Wins","num"],["pb","PB","num"],["avg","Average","num"]];
  el.innerHTML=`<table class="pt2" style="min-width:700px"><thead><tr><th>#</th>${cols.map(c=>`<th class="${c[2]}" data-k="${c[0]}">${c[1]}${k===c[0]?(d<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>${sorted.map((r,i)=>{
    const s=r[v]||{},bad=r.state!=="d",wait=`<span class="mut">${r.state==="e"?"×":"…"}</span>`;
    const c=(x,f,cls)=>`<td class="num ${cls||""}">${bad?wait:x!=null?f(x):"—"}</td>`;
    return `<tr><td class="mut">${i+1}</td><td><span class="who">${`<span class="flag-slot">${flagSlot(r.country)}</span>`}<img class="head" alt="" width="40" height="40" loading="lazy" src="https://laby.net/api/v3/render/bust/${enc(r.uuid||r.name)}.webp?width=40&height=40"><a href="#${enc(r.name)}">${esc(r.name)}</a></span></td>`+
      `<td class="num"><span class="who">${bad?wait:icon(r.elo,22)+(r.elo!=null?r.elo:"—")}</span></td>`+
      c(s.wr,x=>x.toFixed(1)+"%")+c(s.games,x=>x)+c(s.wins,x=>x)+
      c(s.pb,fmtP,s.pb!=null&&s.pb===bpb?"best":"")+c(s.avg,fmtP,s.avg!=null&&s.avg===bavg?"best":"")+`</tr>`}).join("")}</tbody></table>`;
  const done=rows.filter(r=>r.state==="d"||r.state==="e").length;
  const ps=$("pstat");if(ps)ps.textContent=done+" / "+names.length+" players loaded";
  const se=$("lbsent");if(se)se.textContent=T.lb&&T.shown>=T.lb.users.length?"End of leaderboard · "+T.lb.users.length+" players":"Loading more…";
}

function moreRows(){
  const board=T.historical||T.lb;
  if(!board||!Array.isArray(board.users)||T.shown>=(T.historical?historicalRows().length:board.users.length))return;
  T.shown+=10;if(T.historical)renderHistorical();else{shownNames().forEach(loadRow);renderPT();}
  const se=$("lbsent");if(lio&&se){lio.unobserve(se);lio.observe(se)}
}
function historicalRows(){
  if(!T.historical)return [];
  return T.historical.users.map((u,i)=>{
    const standing=u.seasonResult||{};
    const elo=standing.eloRate??u.eloRate;
    const rank=standing.eloRank??u.eloRank;
    const key=String(T.view)+":"+u.uuid;
    return {u,i,elo,rank,stats:T.histCache[key]||null};
  }).filter(r=>!T.country||countryCode(r.u)===T.country);
}
function loadHistoricalStats(rows){
  const req=T.requestId,season=Number(T.view);
  for(const r of rows){
    const key=season+":"+r.u.uuid;
    if(T.histCache[key]||T.histLoading.has(key))continue;
    T.histLoading.add(key);
    enqueue(async()=>{
      try{
        const u=await get(API+"/users/"+enc(r.u.uuid)+"?season="+season);
        T.histCache[key]={...calc(u,"season"),country:countryCode(u)};
      }catch(e){T.histCache[key]={error:true}}
      finally{T.histLoading.delete(key);if(req===T.requestId&&T.historical&&Number(T.view)===season)renderHistorical(false)}
    });
  }
}


/* ---------- global events ---------- */
const out=$("out");
out.addEventListener("change",async e=>{
  if(e.target.id==="fastSeason"){FAST.season=e.target.value;showFastest();return;}
  if(e.target.id==="usSeason"){go("#!useless/"+e.target.value+"/"+US.metric);return;}
  if(e.target.id==="usMetric"){go("#!useless/"+US.view+"/"+e.target.value);return;}
  if(e.target.id==="fastTwitchNames"){FAST.twitchNames=e.target.checked;renderFastest();return;}

  if(e.target.id==="lbseason")go("#!lb/"+e.target.value);
  if(e.target.id==="lbcountry"){
    T.country=e.target.value;T.shown=20;
    showLeaderboard(T.view);
  }
  if(e.target.id==="profileSeason"&&P&&P.u){
    const season=Number(e.target.value),tok=P;
    P.profileSeason=String(season);
    if(season===T.currentSeason){
      P.u=P.combinedUser||P.baseUser;
      const mk=()=>({list:[],done:false,p:null,err:null});
      P.st={ranked:mk(),private:mk(),casual:mk()};P.full=false;P.matchSort="recent";
      renderProfile();return
    }
    const area=$("tiles");if(area)area.innerHTML='<div class="msg">Loading Season '+season+' profile and matches…</div>';
    try{
      // The user endpoint, unlike the leaderboard endpoint, contains season-specific
      // statistics (wins, played matches, PB, etc.).
      const sources=tok.sourceUsers?.length?tok.sourceUsers:[tok.baseUser];
      const seasonUsers=await Promise.all(sources.map(src=>get(API+"/users/"+enc(src.uuid)+"?season="+season)));
      if(P!==tok||String(P.profileSeason)!==String(season))return;
      const user=seasonUsers[0];
      if(!user||!user.uuid)throw Error("Season-specific player data unavailable");
      const combined={...user};
      if(tok.merged&&seasonUsers.length>1){
        combined.nickname="HDMICables";combined.statistics={...(user.statistics||{})};
        for(const other of seasonUsers.slice(1))for(const scope of ["season","total"])
          combined.statistics[scope]=mergeNumericTree(combined.statistics[scope]||{},other.statistics?.[scope]||{});
      }
      tok.u=combined;
      const mk=()=>({list:[],done:false,p:null,err:null});
      tok.st={ranked:mk(),private:mk(),casual:mk()};tok.full=false;tok.matchSort="recent";
      renderProfile();
    }catch(err){if(P===tok&&String(P.profileSeason)===String(season)&&$("tiles"))$("tiles").innerHTML='<div class="msg">'+esc(err.message)+'</div>'}
  }
});
out.addEventListener("change",e=>{if(e.target.id==="matchTwitchNames"&&P){P.matchTwitchNames=e.target.checked;renderMatchRows();}if(e.target.id==="matchSort")setMatchSort(e.target.value);if(e.target.id==="matchMode"&&P&&P.st&&MT[e.target.value]!=null&&P.mode!==e.target.value){P.mode=e.target.value;P.matchSort="recent";renderProfile()}});
out.addEventListener("click",e=>{
  const fm=e.target.closest("[data-fast-match]");if(fm){openMatch(fm.dataset.fastMatch);return;}
  if(e.target.closest("#fastMore")){FAST.limit+=150;showFastest();return;}
  const t=e.target;
  const copyBtn=t.closest("[data-copy-discord]");if(copyBtn){
    const username=copyBtn.dataset.copyDiscord||"";
    const copied=()=>{const label=copyBtn.querySelector("[data-discord-label]");if(label){label.textContent="Copied!";setTimeout(()=>{if(label.isConnected)label.textContent=username},1400)}};
    const fallback=()=>{const ta=document.createElement("textarea");ta.value=username;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");copied()}catch(_){}ta.remove()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(username).then(copied).catch(fallback);else fallback();
    return;
  }
  const op=t.closest("[data-open]");if(op){openMatch(op.dataset.open);return}
  const md=t.closest("[data-pm]");if(md&&P&&P.st){if(P.mode!==md.dataset.pm){P.mode=md.dataset.pm;P.matchSort="recent";renderProfile()}return}
  const g=t.closest("[data-g]");if(g&&P&&P.st){setFull(g.dataset.g==="full");return}
  const th=t.closest("th[data-k]");if(th){const k=th.dataset.k;if(T.sort.k===k){if(k!=="elo")T.sort.d*=-1;else T.sort.d=-1;}else T.sort={k,d:(k==="avg"||k==="pb"||k==="name")?1:-1};(T.historical?renderHistorical():renderPT());return}
  const se=t.closest("#sent");if(se&&se.dataset.retry&&P&&P.st){P.st[P.mode].err=null;loadMore(P.mode);return}
  if(t.closest("a"))return;
  const tr=t.closest("tr.pt");
  if(tr){const id=tr.dataset.id;
    if(P&&P.st&&P.mode==="ranked"){const ix=pts.findIndex(p=>String(p.id)===String(id));if(ix>0)select(ix,false)}
    openMatch(id)}
});

// Persistent website settings: font and background.
(()=>{
 const select=document.getElementById('fontChoice');
 const background=null;
 const wrap=document.getElementById('settingsWrap');
 const toggle=document.getElementById('settingsToggle');
 if(!select||!wrap||!toggle)return;
 const fontKey='mcsr-stats-font';
 toggle.addEventListener('click',()=>{const opened=wrap.classList.toggle('open');toggle.setAttribute('aria-expanded',String(opened));});
 document.addEventListener('click',e=>{if(!wrap.contains(e.target)){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 const originalText=new WeakMap();
 const map={a:'ᔑ',b:'ʖ',c:'ᓵ',d:'↸',e:'ᒷ',f:'⎓',g:'⊣',h:'〒',i:'╎',j:'リ',k:'ꖌ',l:'ꖎ',m:'ᒲ',n:'リ',o:'𝙹',p:'!¡',q:'ᑑ',r:'∷',s:'ᓭ',t:'ℸ',u:'⚍',v:'⍊',w:'∴',x:'̇/',y:'||',z:'⨅'};
 const sga=t=>t.replace(/[a-z]/gi,ch=>{const v=map[ch.toLowerCase()]||ch;return ch===ch.toUpperCase()?v.toUpperCase():v});
 function process(root,mode){
  if(root.nodeType===Node.TEXT_NODE){if(!originalText.has(root))originalText.set(root,root.nodeValue);const original=originalText.get(root);const next=mode==='sga'?sga(original):original;if(root.nodeValue!==next)root.nodeValue=next;return;}
  if(root.nodeType!==Node.ELEMENT_NODE)return;
  if(/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT)$/i.test(root.tagName)||root.closest('#settingsWrap'))return;
  for(const n of root.childNodes)process(n,mode);
 }
 let changing=false;
 const observer=new MutationObserver(records=>{if(changing||select.value!=='sga')return;changing=true;const mode=select.value;for(const r of records){for(const n of r.addedNodes)process(n,mode);if(r.type==='characterData')process(r.target,mode)}changing=false});
 function applyFont(mode){document.body.classList.toggle('font-minecraft',mode==='minecraft');changing=true;process(document.body,mode);changing=false;}
 select.value=localStorage.getItem(fontKey)||'default';
 applyFont(select.value);
 if(select.value==='sga')observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 select.addEventListener('change',()=>{observer.disconnect();localStorage.setItem(fontKey,select.value);applyFont(select.value);if(select.value==='sga')observer.observe(document.body,{subtree:true,childList:true,characterData:true})});
})();
try{
 const result=route();
 if(result&&typeof result.catch==='function')result.catch(e=>showStartupError(e?.stack||e?.message||e));
}catch(e){showStartupError(e?.stack||e?.message||e)}
if(!document.getElementById('out')?.innerHTML.trim())showStartupError('Initial page rendering did not produce content.');

</script>
<script>
/* UI localization: translate rendered interface text, not usernames or API data. */
(()=>{
 const ja={
 'Fastest Time':'最速タイム','Leaderboard':'ランキング','Profile':'プロフィール','Settings':'設定','Font':'フォント',
 'Default':'デフォルト','Minecraft font':'マインクラフトフォント','Standard Galactic Alphabet':'銀河標準文字',
 'Search':'検索','Season':'シーズン','All time':'全期間','All Time':'全期間','This season':'今シーズン',
 'Current season':'今シーズン','Season leaderboard':'シーズンランキング','Historical leaderboard':'過去のランキング',
 'Ranked Matches':'ランクマッチ','RANKED MATCHES':'ランクマッチ','Match type':'マッチタイプ','Sort matches':'並び替え',
 'Most recent':'新しい順','Oldest first':'古い順','Fastest first':'速い順','Fastest':'最速','Ranked':'ランク','Private room':'プライベートルーム','Casual':'カジュアル',
 'Result':'結果','RESULT':'結果','Opponent':'対戦相手','OPPONENT':'対戦相手','Time':'タイム','TIME':'タイム','Elo':'Elo','ELO':'Elo','Seed':'シード','SEED':'シード','When':'日時','WHEN':'日時','VOD':'配信録画',
 'WIN':'勝利','LOSS':'敗北','DRAW':'引き分け','Win':'勝利','Loss':'敗北','Draw':'引き分け',
 'Player':'プレイヤー','PLAYER':'プレイヤー','Players':'プレイヤー','Country':'国','Rank':'順位','RANK':'順位',
 'Wins':'勝利数','Losses':'敗北数','Matches':'マッチ数','MATCHES':'マッチ数','Win rate':'勝率','Best time':'ベストタイム',
 'Avg. finish':'平均クリア','Win streak':'連勝','Forfeit rate':'棄権率','Total':'合計','Average':'平均',
 'Fastest Time Leaderboard':'最速タイムランキング','Seed type':'シードタイプ','Bastion type':'砦タイプ',
 'Twitch names':'Twitch名','Use Twitch names':'Twitch名を表示','Show Twitch names':'Twitch名を表示',
 'Full season':'シーズン全体','Last 50':'直近50件','Last 10':'直近10件','Match history':'対戦履歴',
 'Loading leaderboard…':'ランキングを読み込み中…','Loading more…':'読み込み中…','Loading…':'読み込み中…',
 'Search player':'プレイヤー検索','Recent matches':'最近のマッチ','Best':'ベスト','Points':'ポイント',
 'Show more':'もっと見る','Close':'閉じる','Completed':'完了','Date':'日付','Season stats':'シーズン統計',
 'No matches found':'マッチが見つかりません','No results':'結果がありません','Profile not found':'プロフィールが見つかりません',
 'Useless Stats':'役に立たない統計','Most FFs':'最多FF','Most Deaths':'最多死亡回数','Most World Resets':'最多ワールドリセット','Most Overworld Deaths':'最多オーバーワールド死亡','Most End Deaths':'最多エンド死亡','Most Forfeits After Opponent’s Dragon Dies':'相手のドラゴン死亡後の最多FF','Season':'シーズン','All Time':'全期間'
 };
 const original=new WeakMap(); let lang='en', busy=false;
 const skip='SCRIPT,STYLE,INPUT,TEXTAREA,CODE,PRE,OPTION';
 function translate(root){if(busy)return;busy=true;try{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
   const el=n.parentElement;if(!el||el.closest(skip)||el.closest('.fast-player,.opp-name,.social-name,.logo,[data-fast-user]'))continue;
   const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;
   if(!original.has(n))original.set(n,raw);
   const base=original.get(n),t=base.trim();
   let v=lang==='ja'?(ja[t]||ja[t.toUpperCase()]||null):null;
   if(lang==='ja'&&!v){
    let m=t.match(/^(\d+) loaded$/);if(m)v=m[1]+' 件読み込み済み';
    m=t.match(/^(\d+) ranked matches$/);if(m)v='ランクマッチ '+m[1]+' 件';
    m=t.match(/^(\d+) matches$/);if(m)v=m[1]+' マッチ';
   }
   const next=v?base.replace(t,v):base;
   if(n.nodeValue!==next)n.nodeValue=next;
  }
  document.documentElement.lang=lang;
  const q=document.getElementById('q');if(q)q.placeholder=lang==='ja'?'プレイヤー名またはUUID':'Player name or UUID';
 }finally{busy=false}}
 function apply(v){lang=v==='ja'?'ja':'en';try{localStorage.setItem('rankedstats-language',lang)}catch(e){};translate(document.body)}
 function init(){const sel=document.getElementById('languageChoice');if(!sel)return;
  try{lang=localStorage.getItem('rankedstats-language')==='ja'?'ja':'en'}catch(e){}
  sel.value=lang;sel.addEventListener('change',()=>apply(sel.value));translate(document.body);
  // Batch DOM updates; never translate recursively from the observer's own edits.
  let pending=new Set(), scheduled=false;
  const observer=new MutationObserver(ms=>{
   for(const m of ms){
    if(m.type==='childList')for(const n of m.addedNodes){if(n.nodeType===1)pending.add(n);else if(n.nodeType===3&&n.parentElement)pending.add(n.parentElement)}
    else if(m.type==='characterData'&&m.target.parentElement)pending.add(m.target.parentElement);
   }
   if(scheduled||!pending.size)return;
   scheduled=true;
   requestAnimationFrame(()=>{
    scheduled=false;observer.disconnect();
    const roots=[...pending];pending.clear();
    for(const r of roots)if(r.isConnected)translate(r);
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
   });
  });
  observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
