.who{display:inline-flex;align-items:center;gap:6px}.supporter-name{background:linear-gradient(90deg,#fff0a6,#ffc928,#fff4bd,#d99a00,#fff0a6);background-size:220% 100%;animation:supporterGold 3.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}.supporter-pick{display:inline-block;color:#f4c542;font-size:1.02em;line-height:1;filter:drop-shadow(0 0 4px rgba(255,190,35,.35));vertical-align:-.04em}.hero h1 .supporter-name{display:inline-block}@keyframes supporterGold{to{background-position:220% 0}}@media(prefers-reduced-motion:reduce){.supporter-name{animation:none}}.head{width:40px;height:40px;border-radius:5px;object-fit:contain;image-rendering:auto;flex:none;background:var(--surface2)}

@keyframes lyxierVignette{from{opacity:.68}to{opacity:1}}

.avatar{width:84px;height:84px;border-radius:calc(var(--r)*.9);object-fit:contain;image-rendering:auto;background:var(--surface2)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}

.sub{color:var(--muted);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.elo{text-align:right}

.elo .n{background-size:200% 100%;animation:eloflow 4s linear infinite}.elo .peak-flame{display:inline-block;margin-left:5px;font-size:.62em;vertical-align:.12em;transform-origin:50% 85%;filter:drop-shadow(0 0 5px #ff6a00);-webkit-text-fill-color:initial;color:#ff7a18;animation:peakFlameDance .7s ease-in-out infinite alternate;will-change:transform,filter}@keyframes peakFlameDance{0%{transform:translateY(1px) rotate(-8deg) scale(.94);filter:drop-shadow(0 0 3px #ff4b00) brightness(.95)}45%{transform:translateY(-1px) rotate(5deg) scale(1.08);filter:drop-shadow(0 0 8px #ff6a00) brightness(1.2)}100%{transform:translateY(-2px) rotate(-3deg) scale(1.02);filter:drop-shadow(0 0 6px #ffb000) brightness(1.1)}}@media(prefers-reduced-motion:reduce){.elo .peak-flame{animation:none}}

@media(prefers-reduced-motion:reduce){.hero h1 .profile-username{animation:none}}
.elo .n.t-netherite{background-image:linear-gradient(90deg,#9b4dff,#ff3df0,#c084fc,#7b2cff,#9b4dff)}

.elo .n.t-gold{background-image:linear-gradient(90deg,#ffe14a,#f5a800,#fff08a,#e69500,#ffe14a)}
.elo .n.t-iron{background-image:linear-gradient(90deg,#c9ced8,#f4f6fa,#9aa3b2,#e2e6ee,#c9ced8)}

.pill b{color:var(--text);font-weight:600}.pill{cursor:default}
.bar{display:flex;gap:12px;align-items:center;margin:14px 0 0;flex-wrap:wrap}

.twitch-live-dot{display:none;width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15);flex:none;vertical-align:middle}.twitch-live-dot.is-live{display:inline-block}.twitch-live-label{display:none;color:#ef4444;font-size:15px;font-weight:800;letter-spacing:.06em}.twitch-live-label.is-live{display:inline}@media(max-width:520px){.social-link{flex:1 1 auto}}

/* End portal profile transition */
#endPortalTransition{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;pointer-events:none;background:radial-gradient(ellipse at center,#160c2bd9 0%,#000e 60%,#000 100%);animation:portalFade .9s ease-out forwards}
#endPortalTransition .portal-frame{position:relative;width:min(44vw,330px);aspect-ratio:.66;border:5px solid #56308b;box-shadow:0 0 0 5px #171124,0 0 22px #a855f7,0 0 70px #7c3aed,inset 0 0 22px #c084fc;background:repeating-linear-gradient(135deg,#8b5cf6aa 0 7px,#24103cdd 7px 15px,#b46bff99 15px 19px);animation:portalPulse .22s ease-in-out infinite alternate;transform:perspective(500px) rotateY(-12deg) scale(.1);border-radius:3px}
#endPortalTransition .portal-inner{position:absolute;inset:10px;background:radial-gradient(ellipse,#c084fcaa 0%,#7c3aedaa 25%,#1b1030 70%);animation:portalSwirl .7s linear infinite;border:1px solid #d8b4fe}
@keyframes portalFade{0%{opacity:0}12%{opacity:1}65%{opacity:1}100%{opacity:0}}
@keyframes portalPulse{from{filter:hue-rotate(-15deg) brightness(.8);transform:perspective(500px) rotateY(-12deg) scale(.86)}to{filter:hue-rotate(20deg) brightness(1.4);transform:perspective(500px) rotateY(12deg) scale(1)}}
@keyframes portalSwirl{to{filter:hue-rotate(360deg);background-position:80px 40px}}
@media(prefers-reduced-motion:reduce){#endPortalTransition,#endPortalTransition *{animation-duration:.01ms!important}}

/* Randomized, explicitly fictional player tributes */
.player-tribute{position:relative;display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:26px;align-items:center;overflow:hidden;margin:18px 0 22px;padding:clamp(20px,4vw,38px);min-height:250px;border:1px solid var(--line);background:radial-gradient(ellipse at 15% 45%,rgba(205,190,150,.12),transparent 45%),linear-gradient(135deg,#111 0%,#080808 58%,#15120e 100%);box-shadow:inset 0 0 0 5px rgba(255,255,255,.018),inset 0 0 50px rgba(0,0,0,.55);}
.player-tribute:before{content:"✦";position:absolute;right:22px;top:12px;color:rgba(220,205,164,.3);font-size:28px;pointer-events:none}
.player-tribute:after{content:"IN LOVING MEMORY";position:absolute;right:18px;bottom:12px;color:rgba(220,205,164,.45);font-size:8px;letter-spacing:.18em;pointer-events:none}
.tribute-art-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
.player-tribute .tribute-art{display:block;width:min(100%,190px);height:190px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.65));}
.tribute-art-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#c9b98b;text-align:center}
.tribute-content{position:relative;z-index:1;min-width:0}
.tribute-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#c9b98b;font-weight:700;margin-bottom:10px;}
.tribute-title{font-family:Lora,Georgia,serif;font-size:clamp(24px,3.4vw,38px);line-height:1.15;margin:0 0 15px;font-weight:600;letter-spacing:-.025em;color:#eee6d4;}
.tribute-copy{font-family:Lora,Georgia,serif;font-size:14px;line-height:1.9;color:#d0cbc0;max-width:900px;margin:0;}
.tribute-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px;font-size:10px;color:#c9b98b;}
.tribute-meta span{padding:6px 8px;border:1px solid rgba(201,185,139,.24);background:rgba(0,0,0,.2);}
@media(max-width:620px){.player-tribute{grid-template-columns:1fr;gap:14px;text-align:center;padding:22px 16px 34px}.player-tribute .tribute-art{width:132px;height:132px}.tribute-title{font-size:25px}.tribute-meta{justify-content:center}.player-tribute:after{left:8px;right:8px;text-align:center;font-size:7px}}

}
@media (max-width:420px){

// Independent bootstrap guard: also runs when the main script fails to parse.
(function(){
 let failure='';
 window.addEventListener('error',function(e){failure=e.message||'JavaScript error';show();});
 window.addEventListener('unhandledrejection',function(e){failure=String(e.reason&&e.reason.message||e.reason||'Async startup error');show();});
 function show(){
  const out=document.getElementById('out');
  if(!out||out.textContent.trim()&&!document.getElementById('initialLoadStatus'))return;
  const section=document.createElement('section');section.className='card';section.style.cssText='padding:24px;margin:24px auto;max-width:740px';
  const heading=document.createElement('h2');heading.textContent='Website startup failed';
  const detail=document.createElement('pre');detail.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';detail.textContent=failure||'Main application did not render. Check browser console for details.';
  section.append(heading,detail);out.replaceChildren(section);
 }
 window.addEventListener('load',function(){setTimeout(show,3500)});
})();

<script>
// Surface unexpected startup failures instead of leaving an empty page.
function showStartupError(message){
 const out=document.getElementById('out');
 if(!out||out.children.length&&!document.getElementById('initialLoadStatus'))return;
 out.innerHTML='<section class="card" style="margin:24px auto;max-width:700px;padding:24px"><h2>Website failed to load</h2><p>Please copy this error so we can fix it:</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section>';
 out.querySelector('pre').textContent=String(message||'Unknown error');
}
window.addEventListener('error',event=>showStartupError(event.message||event.error?.message));
window.addEventListener('unhandledrejection',event=>showStartupError(event.reason?.message||event.reason));

const API="https://api.mcsrranked.com";
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{if(ms==null||isNaN(ms))return"—";const s=Math.round(ms/1000);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)};
const fmtP=ms=>{if(ms==null||isNaN(ms))return"—";const t=Math.round(ms),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),c=t%1000;return m+":"+("0"+s).slice(-2)+"."+("00"+c).slice(-3)};
const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"—";
const cname=c=>{try{return new Intl.DisplayNames(["en"],{type:"region"}).of(String(c).toUpperCase())||c}catch(e){return c}};
const ago=t=>{if(!t)return"";const hours=Math.max(0,Math.floor((Date.now()/1000-t)/3600));const d=Math.floor(hours/24);return d<2?Math.max(1,hours)+"h ago":d<30?d+"d ago":Math.floor(d/30)+"mo ago"};
const get=(url,t)=>{t=t||0;return fetch(url).then(async r=>{
  if(!r.ok){
    const e=new Error("MCSR API returned HTTP "+r.status);e.status=r.status;
    if(t<2&&(r.status===429||r.status>=500))return new Promise(resolve=>setTimeout(resolve,1500*(t+1))).then(()=>get(url,t+1));
    throw e;
  }
  let j;
  try{j=await r.json()}catch(e){if(t<2)return new Promise(resolve=>setTimeout(resolve,700*(t+1))).then(()=>get(url,t+1));throw new Error("MCSR API returned invalid JSON")}
  if(j.status!=="success"){
    const raw=j.data,m=typeof raw==="string"?raw:(raw&&raw.message)||"MCSR API request failed";
    if(t<3&&/too many|rate|temporar|try again/i.test(m))return new Promise(resolve=>setTimeout(resolve,2000*(t+1))).then(()=>get(url,t+1));
    throw new Error(m)
  }
  return j.data
}).catch(e=>{
  if(t<2&&(!e.status||e.status>=500))return new Promise(resolve=>setTimeout(resolve,700*(t+1))).then(()=>get(url,t+1));
  throw e
})};

/* ---------- country display ---------- */
function flag(code){
  const c=String(code||"").trim().toLowerCase();
  if(!/^[a-z]{2}$/.test(c))return "";
  return `<span class="country-flag" role="img" aria-label="${esc(cname(c))} flag" title="${esc(cname(c))}" style="background-image:url('https://flagcdn.com/${c}.svg')"></span>`;
}
function flagSlot(code){return flag(code)||'<span class="country-flag flag-placeholder" aria-hidden="true"></span>';}
function countryCode(u){return String(u&&u.country||"").toUpperCase()}
// The API has used different supporter-related field names across versions; only mark explicit supporter data.
function isSupporter(u){
  if(!u||typeof u!=="object")return false;
  const keys=["supporterTier","supporter_tier","supporterLevel","supporter_level","supporterStatus","supporter_status","isSupporter","is_supporter","supporter","supporterBadge","supporter_badge"];
  for(const k of keys){if(!(k in u))continue;const v=u[k];if(v===true||(typeof v==="number"&&v>0)||(typeof v==="string"&&/^(yes|true|active|supporter|tier\s*[1-9]|[1-9])$/i.test(v.trim())))return true;if(v&&typeof v==="object"&&(v.active===true||v.enabled===true||v.tier||v.level||v.name))return true;}
  return false;
}
function emojiName(name,u){return esc(name||"—");}
function supporterName(u,name){return emojiName(name||u?.nickname||"—",u)}
function countryOptions(){
  const countries=[];
  for(let a=65;a<=90;a++)for(let b=65;b<=90;b++){
    const c=String.fromCharCode(a,b),n=cname(c);
    if(n!==c&&n&&!/Unknown Region/i.test(n))countries.push({code:c,name:n});
  }
  countries.sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
  return '<option value="">All countries</option>'+countries.map(({code,name})=>
    `<option value="${code}" ${T.country===code?"selected":""}>${esc(name)}</option>`).join("");
}

 return MERGED_PLAYER_GROUPS.find(g=>g.primary.toLowerCase()===n||g.aliases.some(a=>a.toLowerCase()===n))||null;

function mergeNumericTree(a,b){

 if(a&&b&&typeof a==="object"&&typeof b==="object"&&!Array.isArray(a)&&!Array.isArray(b)){
  const out={...a};for(const k of Object.keys(b))out[k]=k in a?mergeNumericTree(a[k],b[k]):b[k];return out;
 }

}
function normalizeMergedMatch(match,sourceUsers,primary){

 const mapId=id=>ids.has(String(id))?primary.uuid:id;
 const m={...match};
 if(Array.isArray(m.players))m.players=m.players.map(p=>ids.has(String(p.uuid))?{...p,uuid:primary.uuid,nickname:primary.nickname}:p);
 if(m.result)m.result={...m.result,uuid:mapId(m.result.uuid)};
 for(const key of ["changes","vod","completions","timelines"])if(Array.isArray(m[key]))m[key]=m[key].map(x=>({...x,uuid:mapId(x.uuid)}));

}

async function openRandomRankedProfile(){

function buildPoints(list,u){
  const ordered=list.slice().sort((a,b)=>Number(a.date||0)-Number(b.date||0));
  const entries=ordered.map(m=>({m,c:(m.changes||[]).find(x=>String(x.uuid)===String(u.uuid))})).filter(x=>x.c);
  const valid=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v));
  // Prefer exact post-match Elo from the API. Some API responses omit eloRate;
  // in that case reconstruct the timeline from the user's current/season Elo
  // and the per-match Elo changes, walking backward from the newest match.
  const newestFirst=entries.slice().reverse();
  let anchor=valid(u.eloRate)?Number(u.eloRate):valid(u.elo)?Number(u.elo):null;
  const inferred=new Map();
  if(anchor!==null){
    for(const {m,c} of newestFirst){
      const delta=valid(c.change)?Number(c.change):null;
      if(delta===null)continue;
      inferred.set(String(m.id),anchor);
      anchor-=delta;
    }
  }
  const points=[];
  for(const {m,c} of entries){
    const delta=valid(c.change)?Number(c.change):null;
    const exact=valid(c.eloRate)?Number(c.eloRate):null;
    const elo=exact!==null?exact:inferred.get(String(m.id));
    if(!valid(elo))continue;
    if(!points.length)points.push({base:true,elo:delta!==null?elo-delta:elo});
    points.push({id:m.id,m,elo,before:delta!==null?elo-delta:elo});
  }
  return points;
}

function updateVodTimeline(forced){
  const bar=$("modal").querySelector(".vod-timeline-track");
  if(!bar)return;
  let seconds=forced;
  if(seconds==null){
    const entry=[...vodPlayers.values()].find(v=>v.ready);
    if(!entry)return;
    try{seconds=Math.max(0,entry.player.getCurrentTime()-entry.base-10)}catch(e){return}
  }
  const max=Number(bar.max)||1;
  bar.value=Math.min(max,Math.max(0,seconds));

        let nextIndex=-1;
        for(let i=stage;i<row.length;i++)if(row[i]!=null&&row[i]>seconds){nextIndex=i;break}

        const targetStage=nextIndex>=0?nextIndex+1:count+1;
        const fraction=Math.max(0,Math.min(1,(seconds-previous)/Math.max(1,nextTime-previous)));

      });

  }
}

function seekVod(uuid,ms){

function loadRow(name){

      if(!users.length)throw Error("Player not found");

      if(group&&users.length>1){

    const key=season+":"+r.u.uuid;
    if(T.histCache[key]||T.histLoading.has(key))continue;
    T.histLoading.add(key);
    enqueue(async()=>{
      try{
        const u=await get(API+"/users/"+enc(r.u.uuid)+"?season="+season);
        T.histCache[key]={...calc(u,"season"),country:countryCode(u)};
      }catch(e){T.histCache[key]={error:true}}
      finally{T.histLoading.delete(key);if(req===T.requestId&&T.historical&&Number(T.view)===season)renderHistorical(false)}
    });
  }
}

function structureKey(value){const v=String(value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');const aliases={bastionbridge:'bridge',bastionhousing:'housing',bastionstables:'stables',bastiontreasure:'treasure',treasureroom:'treasure',hoglinstable:'stables',hoglinstables:'stables',ship:'shipwreck',sw:'shipwreck',v:'village',vil:'village',village:'village',bt:'bt',buriedtreasure:'bt',buried:'bt',dt:'dt',deserttemple:'dt',temple:'dt',rp:'rp',ruinedportal:'rp',bridge:'bridge',housing:'housing',stables:'stables',stable:'stables',treasure:'treasure'};return aliases[v]||v;}
function structureCell(value,overworld=false){const v=String(value||'—');const key=structureKey(v);const src=STRUCTURE_ICONS[key];if(!src)return '—';return '<span class="structure-type" title="'+esc(v)+'"><img class="structure-icon" src="'+src+'" alt="'+esc(v)+'"></span>'; }

const FAST={token:0,users:[],runs:new Map(),twitchNames:false,limit:150,loading:false,season:"all"};
function fastRuns(u){return FAST.runs.get(FAST.season+":"+u.uuid)||[]}
function fastWinningRuns(matches,uuid){
 return (Array.isArray(matches)?matches:[]).filter(m=>m.result?.uuid===uuid&&Number(m.result.time)>0&&Number(m.type)===MT.ranked&&!m.forfeit&&!m.forfeited).map(m=>({time:Number(m.result.time),id:m.id,seed:m.seed?.overworld?String(m.seed.overworld).replace(/_/g," "):"—",bastion:m.seed?.nether?String(m.seed.nether).replace(/_/g," "):"—"})).sort((a,b)=>a.time-b.time);
}
function fastRows(){
 const entries=[];
 for(const u of FAST.users){
   const runs=fastRuns(u);
   if(runs.length)entries.push({u,...runs[0]});
 }
 const grouped=new Map();
 for(const row of entries){
   const group=mergedPlayerGroup(row.u.nickname),key=group?group.primary.toLowerCase():row.u.uuid;
   const prior=grouped.get(key);
   if(!prior){grouped.set(key,{...row,mergedGroup:group});continue;}
   if(row.time<prior.time)grouped.set(key,{...row,u:group?prior.u:row.u,mergedGroup:group});
   if(group&&row.u.nickname.toLowerCase()===group.primary.toLowerCase())prior.u=row.u;
 }
 return [...grouped.values()].sort((a,b)=>a.time-b.time).slice(0,FAST.limit);
}
function renderFastest(){
 const host=$("fastList");if(!host)return;
 const rows=fastRows();
 host.innerHTML=rows.length?'<table class="pt2 fast-table"><thead><tr><th>#</th><th>Player</th><th class="fast-time-col">Time</th><th>Seed</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td class="mut">'+(i+1)+'</td><td>'+flagSlot(countryCode(r.u))+' <img class="fast-head" alt="" loading="lazy" src="https://laby.net/api/v3/render/bust/'+enc(r.u.uuid)+'.webp?width=40&height=40"> <span class="fast-player-name">'+esc((FAST.twitchNames&&twitchLogin(r.u))||mergedPlayerGroup(r.u.nickname)?.primary||r.u.nickname)+'</span></td><td class="fast-time-col">'+(r.id?'<button type="button" class="fast-time" data-fast-match="'+esc(r.id)+'" title="View match splits">'+fmtP(r.time)+'</button>':fmtP(r.time))+'</td><td>'+structureCell(r.seed,true)+'</td><td>'+structureCell(r.bastion,false)+'</td></tr>').join("")+'</tbody></table>':'<div class="msg">Loading player PBs…</div>';
 const status=$("fastStatus");if(status)status.textContent=FAST.loading?"Loading…":"";
}
function renderFastSide(){renderFastest();}
async function showFastest(){
 $("out").classList.remove("christmas-profile","lyxier-profile");
 document.body.classList.remove("christmas-profile-bg","lyxier-profile-bg");
 updateLyxierDecor(false);stopLyxierBounce();stopProfile();setTab("fast");
 const token=++FAST.token;FAST.loading=true;
 $("out").innerHTML='<div class="card"><div class="ptools"><h2 style="margin:0">Fastest Time</h2><label for="fastSeason">Season</label><select id="fastSeason"><option value="all" '+(FAST.season==="all"?"selected":"")+'>All time</option>'+Array.from({length:T.currentSeason},(_,i)=>{const n=T.currentSeason-i;return '<option value="'+n+'" '+(String(FAST.season)===String(n)?"selected":"")+'>Season '+n+'</option>'}).join("")+'</select><label class="lb-twitch-toggle" title="Show linked Twitch usernames instead of Minecraft names"><input type="checkbox" id="fastTwitchNames" '+(FAST.twitchNames?'checked':'')+'> Twitch names</label><span class="sp"></span><button type="button" id="fastMore">Load more players</button></div><div id="fastList"></div><p class="mut" id="fastStatus"></p></div>';
 renderFastest();
 try{
   const season=FAST.season==="all"?"":"&season="+encodeURIComponent(FAST.season);
   const records=await get(API+"/record-leaderboard?distinct=true"+season);
   if(token!==FAST.token)return;
   FAST.users=[];
   for(const row of (Array.isArray(records)?records:[])){
     const u=row.user;
     if(!u?.uuid||!Number(row.time)||FAST.users.some(x=>x.uuid===u.uuid))continue;
     FAST.users.push(u);
     FAST.runs.set(FAST.season+":"+u.uuid,[{time:Number(row.time),id:row.id,seed:row.seed?.overworld?String(row.seed.overworld).replace(/_/g," "):"—",bastion:row.seed?.nether?String(row.seed.nether).replace(/_/g," "):"—"}]);
   }
   FAST.loading=false;renderFastest();
   const status=$("fastStatus");
   if(status)status.textContent=FAST.users.length?"Loaded "+Math.min(FAST.users.length,FAST.limit)+" of "+FAST.users.length+" distinct runners":"No record times were returned for this selection.";
 }catch(e){
   if(token===FAST.token){
     FAST.loading=false;
     const status=$("fastStatus");
     if(status)status.textContent="Could not load record leaderboard: "+String(e.message||e);
     renderFastest();
   }
 }
}

    }
    const area=$("tiles");if(area)area.innerHTML='<div class="msg">Loading Season '+season+' profile and matches…</div>';
    try{
      // The user endpoint, unlike the leaderboard endpoint, contains season-specific
      // statistics (wins, played matches, PB, etc.).
      const sources=tok.sourceUsers?.length?tok.sourceUsers:[tok.baseUser];
      const seasonUsers=await Promise.all(sources.map(src=>get(API+"/users/"+enc(src.uuid)+"?season="+season)));
      if(P!==tok||String(P.profileSeason)!==String(season))return;
      const user=seasonUsers[0];
      if(!user||!user.uuid)throw Error("Season-specific player data unavailable");
      const combined={...user};
      if(tok.merged&&seasonUsers.length>1){
        combined.nickname="HDMICables";combined.statistics={...(user.statistics||{})};
        for(const other of seasonUsers.slice(1))for(const scope of ["season","total"])
          combined.statistics[scope]=mergeNumericTree(combined.statistics[scope]||{},other.statistics?.[scope]||{});
      }
      tok.u=combined;
      const mk=()=>({list:[],done:false,p:null,err:null});
      tok.st={ranked:mk(),private:mk(),casual:mk()};tok.full=false;tok.matchSort="recent";
      renderProfile();
    }catch(err){if(P===tok&&String(P.profileSeason)===String(season)&&$("tiles"))$("tiles").innerHTML='<div class="msg">'+esc(err.message)+'</div>'}
  }
});

// Persistent website settings: font and adjustable text size.
(()=>{
 const select=document.getElementById('fontChoice');
 const sizeSelect=document.getElementById('fontSizeChoice');
 const sizeLabel=document.getElementById('fontSizeLabel');
 const wrap=document.getElementById('settingsWrap');
 const toggle=document.getElementById('settingsToggle');
 if(!select||!wrap||!toggle)return;
 const fontKey='mcsr-stats-font',sizeKey='mcsr-stats-font-size';
 const originalSizes=new WeakMap();
 function scaleText(root=document.body){
  const scale=(Number(sizeSelect?.value||100)/100);
  const nodes=[];
  if(root.nodeType===Node.ELEMENT_NODE)nodes.push(root);
  if(root.querySelectorAll)nodes.push(...root.querySelectorAll('*'));
  const eligible=nodes.filter(el=>!(/^(SCRIPT|STYLE|TEXTAREA)$/i.test(el.tagName)||el.closest('#settingsWrap')));
  // Capture every original computed size before changing any ancestor, so sizes do not compound.
  for(const el of eligible)if(!originalSizes.has(el)){const size=parseFloat(getComputedStyle(el).fontSize);if(Number.isFinite(size))originalSizes.set(el,size);}
  for(const el of eligible){const base=originalSizes.get(el);if(Number.isFinite(base))el.style.setProperty('font-size',(base*scale)+'px','important');}
  if(sizeLabel)sizeLabel.textContent=Math.round(scale*100)+'%';
 }
 toggle.addEventListener('click',()=>{const opened=wrap.classList.toggle('open');toggle.setAttribute('aria-expanded',String(opened));});
 document.addEventListener('click',e=>{if(!wrap.contains(e.target)){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 const originalText=new WeakMap();
 const map={a:'ᔑ',b:'ʖ',c:'ᓵ',d:'↸',e:'ᒷ',f:'⎓',g:'⊣',h:'〒',i:'╎',j:'リ',k:'ꖌ',l:'ꖎ',m:'ᒲ',n:'リ',o:'𝙹',p:'!¡',q:'ᑑ',r:'∷',s:'ᓭ',t:'ℸ',u:'⚍',v:'⍊',w:'∴',x:'̇/',y:'||',z:'⨅'};
 const sga=t=>t.replace(/[a-z]/gi,ch=>{const v=map[ch.toLowerCase()]||ch;return ch===ch.toUpperCase()?v.toUpperCase():v});
 function process(root,mode){
  if(root.nodeType===Node.TEXT_NODE){if(!originalText.has(root))originalText.set(root,root.nodeValue);const original=originalText.get(root);const next=mode==='sga'?sga(original):original;if(root.nodeValue!==next)root.nodeValue=next;return;}
  if(root.nodeType!==Node.ELEMENT_NODE)return;
  if(/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT)$/i.test(root.tagName)||root.closest('#settingsWrap'))return;
  for(const n of root.childNodes)process(n,mode);
 }
 let changing=false;
 const observer=new MutationObserver(records=>{if(changing||select.value!=='sga')return;changing=true;const mode=select.value;for(const r of records){for(const n of r.addedNodes)process(n,mode);if(r.type==='characterData')process(r.target,mode)}changing=false});
 function applyFont(mode){document.body.classList.toggle('font-orbitron',mode==='orbitron');document.body.classList.toggle('font-inter',mode==='inter');document.body.classList.toggle('font-minecraft',mode==='minecraft');changing=true;process(document.body,mode);changing=false;}
 window.setAustralianMode=function(active){document.body.classList.toggle('au-upside-down',!!active);};
 select.value=localStorage.getItem(fontKey)||'orbitron';
  if(select.value==='default'){select.value='inter';localStorage.setItem(fontKey,'inter');}
  if(!['orbitron','inter','minecraft','sga'].includes(select.value)){select.value='orbitron';localStorage.setItem(fontKey,'orbitron');}
  if(select.value==='upside'){select.value='orbitron';localStorage.setItem(fontKey,'orbitron');}
 applyFont(select.value);
 if(select.value==='sga')observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 select.addEventListener('change',()=>{observer.disconnect();localStorage.setItem(fontKey,select.value);applyFont(select.value);if(select.value==='sga')observer.observe(document.body,{subtree:true,childList:true,characterData:true})});
 if(sizeSelect){
  sizeSelect.value=localStorage.getItem(sizeKey)||'100';
  scaleText();
  const sizeObserver=new MutationObserver(records=>{for(const r of records)for(const n of r.addedNodes)if(n.nodeType===Node.ELEMENT_NODE)scaleText(n);});
  sizeObserver.observe(document.body,{subtree:true,childList:true});
  sizeSelect.addEventListener('input',()=>{localStorage.setItem(sizeKey,sizeSelect.value);scaleText();});
 }
})();

 const result=route();
 if(result&&typeof result.catch==='function')result.catch(e=>showStartupError(e?.stack||e?.message||e));
}catch(e){showStartupError(e?.stack||e?.message||e)}

(()=>{

 'Result':'結果','RESULT':'結果','Opponent':'対戦相手','OPPONENT':'対戦相手','Time':'タイム','TIME':'タイム','Elo':'Elo','ELO':'Elo','Seed':'シード','SEED':'シード','When':'日時','WHEN':'日時','VOD':'配信録画',
 'WIN':'勝利','LOSS':'敗北','DRAW':'引き分け','Win':'勝利','Loss':'敗北','Draw':'引き分け',
 'Player':'プレイヤー','PLAYER':'プレイヤー','Players':'プレイヤー','Country':'国','Rank':'順位','RANK':'順位',
 'Wins':'勝利数','Losses':'敗北数','Matches':'マッチ数','MATCHES':'マッチ数','Win rate':'勝率','Best time':'ベストタイム',
 'Avg. finish':'平均クリア','Win streak':'連勝','Forfeit rate':'棄権率','Total':'合計','Average':'平均',

 'No matches found':'マッチが見つかりません','No results':'結果がありません','Profile not found':'プロフィールが見つかりません',
 'Useless Stats':'役に立たない統計','Most FFs':'最多FF','Most Deaths':'最多死亡回数','Most World Resets':'最多ワールドリセット','Most Overworld Deaths':'最多オーバーワールド死亡','Most End Deaths':'最多エンド死亡','Most Forfeits After Opponent’s Dragon Dies':'相手のドラゴン死亡後の最多FF','Season':'シーズン','All Time':'全期間'
 };
 const original=new WeakMap(); let lang='en', busy=false;
 const skip='SCRIPT,STYLE,INPUT,TEXTAREA,CODE,PRE,OPTION';
 function translate(root){if(busy)return;busy=true;try{
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
   const el=n.parentElement;if(!el||el.closest(skip)||el.closest('.fast-player,.opp-name,.social-name,.logo,[data-fast-user]'))continue;
   const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;
   if(!original.has(n))original.set(n,raw);
   const base=original.get(n),t=base.trim();
   let v=lang==='ja'?(ja[t]||ja[t.toUpperCase()]||null):null;
   if(lang==='ja'&&!v){
    let m=t.match(/^(\d+) loaded$/);if(m)v=m[1]+' 件読み込み済み';
    m=t.match(/^(\d+) ranked matches$/);if(m)v='ランクマッチ '+m[1]+' 件';
    m=t.match(/^(\d+) matches$/);if(m)v=m[1]+' マッチ';
   }
   const next=v?base.replace(t,v):base;
   if(n.nodeValue!==next)n.nodeValue=next;
  }
  document.documentElement.lang=lang;
  const q=document.getElementById('q');if(q)q.placeholder=lang==='ja'?'プレイヤー名またはUUID':'Player name or UUID';
 }finally{busy=false}}
 function apply(v){lang=v==='ja'?'ja':'en';try{localStorage.setItem('rankedstats-language',lang)}catch(e){};translate(document.body)}
 function init(){const sel=document.getElementById('languageChoice');if(!sel)return;
  try{lang=localStorage.getItem('rankedstats-language')==='ja'?'ja':'en'}catch(e){}
  sel.value=lang;sel.addEventListener('change',()=>apply(sel.value));translate(document.body);
  // Batch DOM updates; never translate recursively from the observer's own edits.
  let pending=new Set(), scheduled=false;
  const observer=new MutationObserver(ms=>{
   for(const m of ms){
    if(m.type==='childList')for(const n of m.addedNodes){if(n.nodeType===1)pending.add(n);else if(n.nodeType===3&&n.parentElement)pending.add(n.parentElement)}
    else if(m.type==='characterData'&&m.target.parentElement)pending.add(m.target.parentElement);
   }
   if(scheduled||!pending.size)return;
   scheduled=true;
   requestAnimationFrame(()=>{
    scheduled=false;observer.disconnect();
    const roots=[...pending];pending.clear();
    for(const r of roots)if(r.isConnected)translate(r);
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
   });
  });
  observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
