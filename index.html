<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>MCSR Ranked · Stats</title>
<style>
:root{--bg:#f4f5f9;--surface:#fff;--surface2:#eceef5;--text:#14162a;--muted:#6a6f8c;--line:#dfe2ee;--accent:#14b87a;--accent2:#6d5dfc;--loss:#e5484d;--win:#14b87a;--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0c14;--surface:#141626;--surface2:#1c1f35;--text:#eceefc;--muted:#8a8fb0;--line:#262a44;--loss:#ff6b6f;--win:#2ee59d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;isolation:isolate;position:relative;min-height:100vh}
/* Full-page animated gradient is the default background, not a panel background. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(-45deg,#100817,#261032,#4b1764,#8a2c12,#d15b16,#392046,#100817);background-size:400% 400%;animation:ambientGradient 22s ease infinite;will-change:background-position}
@keyframes ambientGradient{0%{background-position:0% 50%}25%{background-position:50% 100%}50%{background-position:100% 50%}75%{background-position:50% 0%}100%{background-position:0% 50%}}
body.lyxier-profile-bg::before{background-image:linear-gradient(rgba(10,12,20,.24),rgba(10,12,20,.30)),url("https://femboy.beauty/XJpHkj");background-size:cover;background-position:center center;background-repeat:no-repeat;animation:none;will-change:auto}
#out.lyxier-profile .card,#out.lyxier-profile .tile{background:rgba(15,17,25,.82);backdrop-filter:blur(2px)}
body.dark-everything.lyxier-profile-bg::before{background:#000!important;background-image:none!important}
body.christmas-profile-bg{background:transparent}
body.christmas-profile-bg::before{background-image:linear-gradient(rgba(10,12,20,.24),rgba(10,12,20,.30)),url("https://femboy.beauty/CjusRP");background-size:cover;background-position:center center;background-repeat:no-repeat;animation:none;will-change:auto}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
@media(max-width:700px){body.christmas-profile-bg::before{background-attachment:scroll}}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
nav{display:flex;align-items:center;gap:12px;padding:6px 0 22px;flex-wrap:wrap}
.settings-wrap{position:relative;margin-left:auto;flex:none}.settings-toggle{width:36px;height:36px;padding:0;display:grid;place-items:center;border-radius:9px;font-size:18px;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:0 2px 8px #00000012}.settings-toggle:hover{border-color:var(--accent2)}.settings-panel{display:none;position:absolute;right:0;top:43px;z-index:90;width:260px;max-width:calc(100vw - 32px);padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);box-shadow:0 12px 36px #0005}.settings-wrap.open .settings-panel{display:grid;gap:12px}.settings-title{font-size:14px;font-weight:750;margin:0 0 2px}.setting-field{display:grid;gap:5px}.setting-field label{font-size:12px;color:var(--muted)}.setting-field select{width:100%;padding:9px 10px}
body.font-minecraft,body.font-minecraft button,body.font-minecraft input,body.font-minecraft select{font-family:"Press Start 2P",monospace!important}body.font-minecraft{font-size:11px}body.font-minecraft h1{font-size:20px;letter-spacing:0}body.font-minecraft td,body.font-minecraft th{font-size:10px}
.logo{margin-right:auto;display:flex;align-items:center}.logo img{width:46px;height:46px;border-radius:10px;image-rendering:pixelated;display:block;transition:transform .15s}.logo:hover img{transform:scale(1.06)}
form{display:flex;gap:8px}
input[type=text],button,select{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:calc(var(--r)*.6);padding:9px 14px;font:inherit}
input[type=text]{width:220px;max-width:100%}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
button{cursor:pointer}
button.go{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-weight:600}
.tabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:calc(var(--r)*.7)}
.tabs button{border:0;background:none;padding:7px 14px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ri{vertical-align:middle;object-fit:contain;flex:none;image-rendering:pixelated}
.who{display:inline-flex;align-items:center;gap:6px}.supporter-name{background:linear-gradient(90deg,#fff0a6,#ffc928,#fff4bd,#d99a00,#fff0a6);background-size:220% 100%;animation:supporterGold 3.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}.supporter-pick{display:inline-block;color:#f4c542;font-size:1.02em;line-height:1;filter:drop-shadow(0 0 4px rgba(255,190,35,.35));vertical-align:-.04em}.hero h1 .supporter-name{display:inline-block}@keyframes supporterGold{to{background-position:220% 0}}@media(prefers-reduced-motion:reduce){.supporter-name{animation:none}}.head{width:24px;height:24px;border-radius:5px;image-rendering:pixelated;flex:none;background:var(--surface2)}
/* Randomly scattered Lyxier-only Halloween decorations */
#lyxier-decor{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#lyxier-decor img{position:absolute;width:clamp(65px,9vw,155px);height:auto;max-height:190px;object-fit:contain;opacity:.88;filter:drop-shadow(0 4px 10px rgba(0,0,0,.65));user-select:none}
@media(max-width:700px){#lyxier-decor img{width:clamp(45px,12vw,85px);opacity:.7}}
/* Lyxier-only unsettling atmosphere: dim vignette, faint red breathing, subtle card tension */
body.lyxier-profile-bg::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 43%,transparent 22%,rgba(9,0,7,.38) 70%,rgba(0,0,0,.76) 100%);animation:lyxierVignette 9s ease-in-out infinite alternate}
#out.lyxier-profile .hero{animation:lyxierPulse 7s ease-in-out infinite}
#out.lyxier-profile .card:not(.hero){border-color:rgba(105,24,36,.42);box-shadow:0 5px 25px rgba(15,0,4,.26)}
#out.lyxier-profile h1{text-shadow:0 0 9px rgba(190,14,32,.55),2px 2px 1px rgba(50,0,0,.7)}
#out.lyxier-profile h2{text-shadow:0 0 10px rgba(125,6,26,.35)}
#out.lyxier-profile .tile{border-color:rgba(118,19,35,.28)}
@keyframes lyxierVignette{from{opacity:.68}to{opacity:1}}
@keyframes lyxierPulse{0%,100%{box-shadow:0 0 16px rgba(160,0,25,.18),inset 0 0 22px rgba(90,0,15,.18)}50%{box-shadow:0 0 32px rgba(180,5,27,.42),inset 0 0 30px rgba(125,0,20,.28)}}
@media(prefers-reduced-motion:reduce){body.lyxier-profile-bg::after,#out.lyxier-profile .hero{animation:none}}
/* Lyxier-exclusive Halloween blood drips on the main player card */
#out.lyxier-profile .hero{position:relative;isolation:isolate;overflow:hidden;border-color:rgba(169,12,30,.75);box-shadow:0 0 22px rgba(160,0,25,.22),inset 0 0 22px rgba(90,0,15,.18)}
#out.lyxier-profile .hero::before{content:"";position:absolute;top:0;left:0;right:0;height:76px;pointer-events:none;z-index:2;background:linear-gradient(180deg,#65000b 0%,#a3081a 12%,#d01c2b 26%,#7e0010 100%);clip-path:polygon(0 0,100% 0,100% 14px,96% 14px,96% 29px,94.7% 40px,93.6% 29px,93.6% 14px,86% 14px,86% 48px,84.8% 61px,83.6% 48px,83.6% 14px,75% 14px,75% 26px,73.8% 35px,72.6% 26px,72.6% 14px,64% 14px,64% 40px,62.7% 53px,61.4% 40px,61.4% 14px,52% 14px,52% 22px,50.8% 31px,49.6% 22px,49.6% 14px,41% 14px,41% 55px,39.7% 70px,38.4% 55px,38.4% 14px,29% 14px,29% 31px,27.7% 42px,26.4% 31px,26.4% 14px,17% 14px,17% 45px,15.8% 58px,14.6% 45px,14.6% 14px,7% 14px,7% 25px,5.8% 36px,4.6% 25px,4.6% 14px,0 14px);filter:drop-shadow(0 3px 3px rgba(65,0,0,.5))}
#out.lyxier-profile .hero::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:inherit;box-shadow:inset 0 0 32px rgba(135,0,20,.24)}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:calc(var(--r)*1.15);padding:24px}
.avatar{width:84px;height:84px;border-radius:calc(var(--r)*.9);image-rendering:pixelated;background:var(--surface2)}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.elo{text-align:right}
.elo .n{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;background:linear-gradient(90deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.elo .r{color:var(--muted);font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.elo .n{background-size:200% 100%;animation:eloflow 4s linear infinite}
@keyframes eloflow{to{background-position:200% 0}}
.elo .n.t-netherite{background-image:linear-gradient(90deg,#9b4dff,#ff3df0,#c084fc,#7b2cff,#9b4dff)}
.elo .n.t-diamond{background-image:linear-gradient(90deg,#4fb8ff,#2ee6d6,#87ceeb,#1fd1c4,#4fb8ff)}
.elo .n.t-emerald{background-image:linear-gradient(90deg,#b6ff3b,#12d67a,#7dff6b,#0fbf6d,#b6ff3b)}
.elo .n.t-gold{background-image:linear-gradient(90deg,#ffe14a,#f5a800,#fff08a,#e69500,#ffe14a)}
.elo .n.t-iron{background-image:linear-gradient(90deg,#c9ced8,#f4f6fa,#9aa3b2,#e2e6ee,#c9ced8)}
.elo .n.t-coal{background-image:linear-gradient(90deg,#5c616c,#7d828d,#4a4e57,#5c616c);animation:none}
@media(prefers-reduced-motion:reduce){.elo .n{animation:none}}
.pill b{color:var(--text);font-weight:600}.pill{cursor:default}
.bar{display:flex;gap:12px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.bar .seg{flex:1;max-width:340px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.seg button{width:100%;min-width:0;white-space:nowrap}
.social-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.social-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;cursor:pointer;max-width:100%}
.social-link:hover{border-color:var(--accent2);background:var(--surface2)}
.social-link svg{width:19px;height:19px;flex:none}
.social-link .social-name{overflow-wrap:anywhere}
.social-link.discord{font:inherit;font-weight:600}
.twitch-live-dot{display:none;width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15);flex:none;vertical-align:middle}.twitch-live-dot.is-live{display:inline-block}.twitch-live-label{display:none;color:#ef4444;font-size:11px;font-weight:800;letter-spacing:.06em}.twitch-live-label.is-live{display:inline}
@media(max-width:520px){.social-link{flex:1 1 auto}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent2)}
.tile .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--muted)}
.main{display:grid;gap:14px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;margin-bottom:0}
.card h2{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card h2 span{text-transform:none;letter-spacing:0;font-weight:400}
.chartbox{position:relative;touch-action:pan-y}
svg{display:block;width:100%;height:auto;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.18);min-width:170px;opacity:0;transition:opacity .08s;z-index:5;transform:translate(-50%,-112%)}
#tip b{display:block;font-size:14px;margin-bottom:2px}
#tip .m{color:var(--muted);font-size:12px}
#detail{margin-top:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:calc(var(--r)*.7);font-size:14px;color:var(--muted)}
#detail.on{border:1px solid var(--accent2);color:var(--text);background:var(--surface2)}
.mini{padding:4px 10px;font-size:13px;margin-top:8px;border-color:var(--accent2)}
.scroll{overflow:auto;max-height:520px;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{position:sticky;top:0;background:var(--surface);text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;z-index:1}
td{padding:10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.pt{cursor:pointer}tr.pt:hover td,tr.hl td{background:var(--surface2)}
tr.sel td{background:color-mix(in srgb,var(--accent2) 18%,transparent)}
td a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.mut{color:var(--muted)}
.res{font-weight:700;border-radius:6px;padding:2px 8px;font-size:12px}
.res.w{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.res.l{background:color-mix(in srgb,var(--loss) 18%,transparent);color:var(--loss)}
.res.d{background:var(--surface2);color:var(--muted)}
.up{color:var(--win)}.down{color:var(--loss)}
.msg{text-align:center;padding:60px 20px;color:var(--muted)}
.invalid-profile{text-align:center;padding:30px 18px 42px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:14px}
.invalid-profile h2{margin:0;font-size:clamp(22px,4vw,34px);font-weight:850;letter-spacing:-.035em}
.invalid-profile .invalid-main-image{display:block;width:min(100%,520px);max-height:48vh;object-fit:contain;border-radius:16px}
.invalid-profile .invalid-caption{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:clamp(18px,3vw,25px);font-weight:800}
.invalid-profile .invalid-text-image{display:inline-block;width:clamp(72px,12vw,120px);max-height:48px;object-fit:contain;vertical-align:middle}
.invalid-profile .invalid-detail{color:var(--muted);font-size:13px;overflow-wrap:anywhere}

.skel{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
.sent{text-align:center;color:var(--muted);padding:14px;font-size:13px}
.sent[data-retry="1"]{cursor:pointer;color:var(--loss)}
.country-flag{display:inline-block;vertical-align:-.12em;width:21px;height:16px;flex:none;background-size:cover;background-position:center;background-repeat:no-repeat;border-radius:2px;box-shadow:0 0 0 1px rgba(128,128,128,.2)}
h1 .country-flag{width:28px;height:21px;vertical-align:-.08em;margin-right:5px}
/* players table */
.ptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ptools .sp{flex:1}
table.pt2 th[data-k]{cursor:pointer;user-select:none}
table.pt2 th[data-k]:hover{color:var(--text)}
table.pt2 td.best{color:var(--win);font-weight:700}
table.pt2 td.num{text-align:right}table.pt2 th.num{text-align:right}
.hero h1 .profile-rank.podium-1{color:#ffd76a;text-shadow:0 0 5px rgba(255,215,106,.95),0 0 14px rgba(255,190,45,.85),0 0 28px rgba(245,158,11,.55);font-weight:850}
.hero h1 .profile-rank.podium-2{color:#dce4ef;text-shadow:0 0 5px rgba(235,242,255,.95),0 0 14px rgba(203,213,225,.8),0 0 28px rgba(148,163,184,.55);font-weight:850}
.hero h1 .profile-rank.podium-3{color:#e7a36e;text-shadow:0 0 5px rgba(255,190,135,.95),0 0 14px rgba(231,163,110,.85),0 0 28px rgba(205,127,50,.55);font-weight:850}
.profile-custom-emote{height:1.15em;width:auto;max-width:2em;vertical-align:-.16em;object-fit:contain}
/* One continuous podium gradient per row; transparent cells prevent the gradient from restarting in every column. */
table.pt2 tbody tr:nth-child(1){background:linear-gradient(105deg,rgba(255,207,64,.30) 0%,rgba(245,158,11,.16) 48%,rgba(245,158,11,.07) 100%)}
table.pt2 tbody tr:nth-child(2){background:linear-gradient(105deg,rgba(226,232,240,.26) 0%,rgba(148,163,184,.14) 48%,rgba(148,163,184,.06) 100%)}
table.pt2 tbody tr:nth-child(3){background:linear-gradient(105deg,rgba(205,127,50,.28) 0%,rgba(180,83,9,.14) 48%,rgba(180,83,9,.06) 100%)}
table.pt2 tbody tr:nth-child(-n+3)>td{background:transparent!important}
table.pt2 tbody tr:nth-child(1) td:first-child{color:#ffd76a;font-weight:850;text-shadow:0 0 12px rgba(255,190,45,.22)}
table.pt2 tbody tr:nth-child(2) td:first-child{color:#dce4ef;font-weight:850;text-shadow:0 0 10px rgba(203,213,225,.18)}
table.pt2 tbody tr:nth-child(3) td:first-child{color:#e7a36e;font-weight:850;text-shadow:0 0 10px rgba(205,127,50,.18)}
/* match modal */
#modal{position:fixed;inset:0;background:rgba(5,6,12,.62);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:40}
#modal.open{display:flex}
.mbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*1.1);width:min(980px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox .x{position:absolute;top:10px;right:10px;padding:0 6px;font-size:12px;line-height:1.6;z-index:2;font-family:ui-monospace,Menlo,Consolas,monospace}
.mbox h2{margin:0 0 4px;font-size:20px;padding-right:50px}
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0}
.pc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:calc(var(--r)*.7);background:var(--surface2)}
.pc.winner{border-color:var(--win)}
.pc img.hd{width:44px;height:44px;border-radius:8px;image-rendering:pixelated}
.pc b{display:flex;align-items:center;gap:6px}
.sec3{margin-top:18px}
.sec3>h3{margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.vods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.vodbox{border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:10px;background:var(--surface2)}
.vodbox.none{color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.vh{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:14px}
.vh a{color:var(--accent2);text-decoration:none}
.vodbox iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;display:block}
.vodbox .msg{padding:24px 10px;font-size:13px}
.mbox table{min-width:0}
.mbox td.f{color:var(--win);font-weight:700}
.mbox tr.sp{cursor:pointer}.mbox tr.sp:hover td{background:var(--surface2)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
@media(max-width:860px){.hero{grid-template-columns:auto 1fr}.elo{grid-column:1/-1;text-align:left}.elo .r{justify-content:flex-start}form{width:100%}input[type=text]{flex:1;width:auto}}
.ranked-footer{margin-top:38px;padding:22px 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.ranked-footer strong{font-size:16px}.ranked-footer p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ranked-footer a{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:10px;background:linear-gradient(90deg,var(--accent2),var(--accent));color:white;text-decoration:none;font-weight:700;white-space:nowrap}
.ranked-footer a:hover{filter:brightness(1.1)}

#out.christmas-profile .card,#out.christmas-profile .tile{background:rgba(15,17,25,.82);backdrop-filter:blur(2px)}


/* Optional all-black appearance; Default leaves the original theme untouched. */
body.dark-everything{--bg:#000;--surface:#000;--surface2:#080808;--text:#f5f5f5;--muted:#a3a3a3;--line:#292929;--accent:#14b87a;--accent2:#777;--loss:#ff6b6f;--win:#2ee59d;background:#000}
body.dark-everything::before{background:#000!important;background-image:none!important;animation:none!important}
body.dark-everything.christmas-profile-bg::before{background:#000!important;background-image:none!important}


/* Brief first-load splash screen */
#loadingSplash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#080b1c;color:#fff;opacity:1;animation:splashFadeOut .22s ease 2.28s forwards;pointer-events:all}
#loadingSplash img{display:block;width:min(180px,42vw);height:min(180px,42vw);object-fit:contain;border-radius:14px}
#loadingSplash .loading-label{font:600 15px/1.5 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:lowercase;display:flex;align-items:baseline;gap:3px}
#loadingSplash .loading-dot{opacity:.18;animation:loadingDotBlink 1.2s infinite}
#loadingSplash .loading-dot:nth-child(2){animation-delay:.2s}
#loadingSplash .loading-dot:nth-child(3){animation-delay:.4s}
@keyframes loadingDotBlink{0%,15%{opacity:.18}35%,65%{opacity:1}85%,100%{opacity:.18}}
@keyframes splashFadeOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#loadingSplash{animation:none}#loadingSplash .loading-dot{animation:none;opacity:1}}

const BANDS=[[0,"Coal 1"],[400,"Coal 2"],[500,"Coal 3"],[600,"Iron 1"],[700,"Iron 2"],[800,"Iron 3"],[900,"Gold 1"],[1000,"Gold 2"],[1100,"Gold 3"],[1200,"Emerald 1"],[1300,"Emerald 2"],[1400,"Emerald 3"],[1500,"Diamond 1"],[1650,"Diamond 2"],[1800,"Diamond 3"],[2000,"Netherite"]];
function rk(e){if(e==null)return{n:"Unrated",k:"Unrated"};let b=BANDS[0];for(const x of BANDS)if(e>=x[0])b=x;return{n:b[1],k:b[1].replace(" ","")}}
function icon(e,s){const r=rk(e);s=s||22;return `<img class="ri" width="${s}" height="${s}" src="${ICN[r.k]}" alt="${r.n}" title="${r.n}${e!=null?" · "+e:""}" loading="lazy" onerror="this.style.visibility='hidden'">`}

/* ---------- country display ---------- */
function flag(code){
  const c=String(code||"").trim().toLowerCase();
  if(!/^[a-z]{2}$/.test(c))return "";
  return `<span class="country-flag" role="img" aria-label="${esc(cname(c))} flag" title="${esc(cname(c))}" style="background-image:url('https://flagcdn.com/${c}.svg')"></span>`;
}
function countryCode(u){return String(u&&u.country||"").toUpperCase()}
// The API has used different supporter-related field names across versions; only mark explicit supporter data.
function isSupporter(u){
  if(!u||typeof u!=="object")return false;
  const keys=["supporterTier","supporter_tier","supporterLevel","supporter_level","supporterStatus","supporter_status","isSupporter","is_supporter","supporter","supporterBadge","supporter_badge"];
  for(const k of keys){if(!(k in u))continue;const v=u[k];if(v===true||(typeof v==="number"&&v>0)||(typeof v==="string"&&/^(yes|true|active|supporter|tier\s*[1-9]|[1-9])$/i.test(v.trim())))return true;if(v&&typeof v==="object"&&(v.active===true||v.enabled===true||v.tier||v.level||v.name))return true;}
  return false;
}
function supporterName(u,name){return isSupporter(u)?`<span class="supporter-name">${esc(name||u.nickname||"—")}</span> <span class="supporter-pick" title="MCSR Ranked Supporter" aria-label="Supporter">⛏️</span>`:esc(name||u.nickname||"—")}
function countryOptions(){
  const countries=[];
  for(let a=65;a<=90;a++)for(let b=65;b<=90;b++){
    const c=String.fromCharCode(a,b),n=cname(c);
    if(n!==c&&n&&!/Unknown Region/i.test(n))countries.push({code:c,name:n});
  }
  countries.sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
  return '<option value="">All countries</option>'+countries.map(({code,name})=>
    `<option value="${code}" ${T.country===code?"selected":""}>${esc(name)}</option>`).join("");
}

const MT={casual:1,ranked:2,private:3};
const UC={},MC={};
function getUser(n){const k=String(n).toLowerCase();if(!UC[k]){UC[k]=get(API+"/users/"+enc(n));UC[k].catch(()=>{delete UC[k]})}return UC[k]}
function fetchMatches(who,type,before,count,sort,season){return get(API+"/users/"+enc(who)+"/matches?count="+count+"&type="+type+(before?"&before="+before:"")+(sort?"&sort="+sort:"")+(season?"&season="+season:""))}
const Q=[];let running=0;
function enqueue(fn){Q.push(fn);pump()}
function pump(){while(running<3&&Q.length){running++;Q.shift()().then(()=>{},()=>{}).then(()=>{running--;pump()})}}
const stat=(u,scope,k)=>{const o=u.statistics&&u.statistics[scope];return o&&o[k]&&o[k].ranked!=null?o[k].ranked:null};

function me(x,uid){return(x.changes||[]).find(c=>c.uuid===uid)}
function info(x,uid){
  const opp=(x.players||[]).find(p=>p.uuid!==uid)||{},c=me(x,uid)||{};
  const dec=!!x.decayed,draw=!x.result||!x.result.uuid,won=!draw&&x.result.uuid===uid;
  return{opp,c,draw,won,dec,res:dec?"DECAY":draw?"DRAW":won?"WIN":"LOSS",time:x.result&&x.result.time>0?fmt(x.result.time):"—",change:c.change,
    seed:String((x.seed&&x.seed.overworld)||"—").replace(/_/g," "),bastion:String((x.seed&&x.seed.nether)||"").replace(/_/g," ")}
}

const go=h=>{if(location.hash===h)route();else location.hash=h};
function route(){
  closeModal();if(lio){lio.disconnect();lio=null}
  const raw=location.hash.slice(1);
  const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
  if(!raw||raw.indexOf("!lb")===0||raw.indexOf("!players")===0){const p=raw.split("/");return showLeaderboard(p[1]||"season")}
  showProfile(dec(raw));
}

/* Lyxier-only DVD-style bouncing cards; transforms never affect document layout. */
let lyxierBounceFrame=0,lyxierBounceItems=[],lyxierBounceLast=0;
function stopLyxierBounce(){
  if(lyxierBounceFrame)cancelAnimationFrame(lyxierBounceFrame);
  lyxierBounceFrame=0;lyxierBounceLast=0;
  for(const item of lyxierBounceItems)item.el.style.transform="";
  lyxierBounceItems=[];
}
function startLyxierBounce(){
  stopLyxierBounce();
  const root=document.getElementById("out");
  if(!root?.classList.contains("lyxier-profile")||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cards=[...root.querySelectorAll(".card,.tile")];
  lyxierBounceItems=cards.map((el,i)=>{
    const rect=el.getBoundingClientRect();
    // Keep each component inside the visible browser window, not its original grid cell.
    const minX=8-rect.left,maxX=window.innerWidth-rect.right-8;
    const minY=8-rect.top,maxY=window.innerHeight-rect.bottom-8;
    const x=Math.min(maxX,Math.max(minX,0)),y=Math.min(maxY,Math.max(minY,0));
    return {el,x,y,vx:(i%2?1:-1)*(16+i%4*4),vy:(i%3?1:-1)*(12+i%3*4)};
  });
  function frame(now){
    if(!root.classList.contains("lyxier-profile")){stopLyxierBounce();return}
    const dt=Math.min((now-(lyxierBounceLast||now))/1000,.05);lyxierBounceLast=now;
    for(const item of lyxierBounceItems){
      if(!item.el.isConnected)continue;
      const rect=item.el.getBoundingClientRect();
      const left=rect.left-item.x,top=rect.top-item.y;
      const minX=8-left,maxX=window.innerWidth-left-rect.width-8;
      const minY=8-top,maxY=window.innerHeight-top-rect.height-8;
      item.x+=item.vx*dt;item.y+=item.vy*dt;
      if(maxX<minX)item.x=(minX+maxX)/2;
      else{
        if(item.x>=maxX){item.x=maxX;item.vx=-Math.abs(item.vx)}
        if(item.x<=minX){item.x=minX;item.vx=Math.abs(item.vx)}
      }
      if(maxY<minY)item.y=(minY+maxY)/2;
      else{
        if(item.y>=maxY){item.y=maxY;item.vy=-Math.abs(item.vy)}
        if(item.y<=minY){item.y=minY;item.vy=Math.abs(item.vy)}
      }
      item.el.style.transform="translate3d("+item.x.toFixed(2)+"px,"+item.y.toFixed(2)+"px,0)";
    }
    lyxierBounceFrame=requestAnimationFrame(frame);
  }
  lyxierBounceFrame=requestAnimationFrame(frame);
}

    }else T.lb=T.globalLb;
    if(req!==T.requestId||!$("ptab"))return;
    $("lbhint").textContent=T.country
      ?cname(T.country)+" leaderboard · country-filtered results from the API, up to 150 players."
      :T.view==="all"
        ?"All-time ranked totals for players on the current season leaderboard. Rows fill in gradually because of API rate limits."
        :"Season "+T.currentSeason+" stats: win rate, matches, PB and average are for the current season. Rows fill in gradually because of API rate limits.";
    shownNames().forEach(loadRow);renderPT();
    if(lio){lio.disconnect();lio=null}
    const se=$("lbsent");
    if(se&&window.IntersectionObserver){lio=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))moreRows()},{rootMargin:"400px"});lio.observe(se)}
  }catch(e){if(req===T.requestId&&$("ptab")){$("ptab").innerHTML='<div class="msg">Couldn’t load the selected leaderboard.<br>'+esc(e.message)+'</div>';$("lbsent").textContent="";}}
}
function moreRows(){
  const board=T.historical||T.lb;
  if(!board||!Array.isArray(board.users)||T.shown>=(T.historical?historicalRows().length:board.users.length))return;
  T.shown+=10;if(T.historical)renderHistorical();else{shownNames().forEach(loadRow);renderPT();}
  const se=$("lbsent");if(lio&&se){lio.unobserve(se);lio.observe(se)}
}
function historicalRows(){
  if(!T.historical)return [];
  return T.historical.users.map((u,i)=>{
    const standing=u.seasonResult||{};
    const elo=standing.eloRate??u.eloRate;
    const rank=standing.eloRank??u.eloRank;
    const key=String(T.view)+":"+u.uuid;
    return {u,i,elo,rank,stats:T.histCache[key]||null};
  }).filter(r=>!T.country||countryCode(r.u)===T.country);
}
function loadHistoricalStats(rows){
  const req=T.requestId,season=Number(T.view);
  for(const r of rows){
    const key=season+":"+r.u.uuid;
    if(T.histCache[key]||T.histLoading.has(key))continue;
    T.histLoading.add(key);
    enqueue(async()=>{
      try{
        const u=await get(API+"/users/"+enc(r.u.uuid)+"?season="+season);
        T.histCache[key]={...calc(u,"season"),country:countryCode(u)};
      }catch(e){T.histCache[key]={error:true}}
      finally{T.histLoading.delete(key);if(req===T.requestId&&T.historical&&Number(T.view)===season)renderHistorical(false)}
    });
  }
}
function renderHistorical(fetchStats=true){
  const el=$("ptab");if(!el||!T.historical)return;
  const k=T.sort.k,d=T.sort.d;
  const val=r=>k==="name"?r.u.nickname:k==="elo"?r.elo:k==="rank"?r.rank:r.stats?.[k];
  const rows=historicalRows().sort((a,b)=>{
    const x=val(a),y=val(b);
    if(x==null&&y==null)return (b.elo??-Infinity)-(a.elo??-Infinity)||a.i-b.i;
    if(x==null)return 1;if(y==null)return -1;
    return (typeof x==="string"?d*x.localeCompare(y):d*(x-y))||a.i-b.i;
  });
  const shown=rows.slice(0,T.shown);
  const cols=[["name","Player"],["elo","Elo"],["wr","Win rate"],["games","Matches"],["wins","Wins"],["pb","PB"],["avg","Average"]];
  const f=(v,fn)=>v==null?"—":fn?fn(v):esc(v);
  el.innerHTML=`<table class="pt2" style="min-width:700px"><thead><tr><th>#</th>${cols.map(([key,label])=>`<th data-k="${key}" class="${key==="name"?"":"num"}">${label}${k===key?(d<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>${shown.map((r,i)=>{
    const u=r.u,st=r.stats||{},waiting=!r.stats;
    const cell=(v,fn)=>`<td class="num">${waiting?"…":f(v,fn)}</td>`;
    return `<tr><td class="mut">${k==="elo"&&!T.country&&d===-1?(r.rank??i+1):i+1}</td><td><span class="who">${flag(u.country)?`<span title="${esc(cname(u.country))}">${flag(u.country)}</span>`:""}<img class="head" alt="" loading="lazy" src="https://mc-heads.net/avatar/${enc(u.uuid)}/24"><a href="#${enc(u.nickname)}" class="${isSupporter(u)?"supporter-name":""}">${esc(u.nickname)}</a>${profileDecoration(u)}${isSupporter(u)?` <span class="supporter-pick" title="MCSR Ranked Supporter" aria-label="Supporter">⛏️</span>`:""}</span></td><td class="num"><span class="who">${icon(r.elo,22)}${f(r.elo)}</span></td>${cell(st.wr,x=>x.toFixed(1)+"%")}${cell(st.games)}${cell(st.wins)}${cell(st.pb,fmtP)}${cell(st.avg,fmtP)}</tr>`;
  }).join("")}</tbody></table>`;
  $("pstat").textContent=shown.length+" / "+rows.length+" players";
  $("lbsent").textContent=T.shown>=rows.length?"End of leaderboard · "+rows.length+" players":"Scroll for more";
  $("lbhint").textContent="Season "+T.view+" · Elo order comes from the historical leaderboard. Other columns load from each player's season-specific profile; sorting those columns applies to loaded statistics.";
  if(fetchStats)loadHistoricalStats(shown);
}
function renderPT(){
  const el=$("ptab");if(!el)return;
  const v=T.view==="all"?"all":"season",names=shownNames(),rows=names.map(n=>RC[n.toLowerCase()]).filter(Boolean).filter(r=>!T.country||r.country===T.country);
  const k=T.sort.k,d=T.sort.d;
  const val=r=>{if(r.state!=="d")return null;if(k==="name")return r.name;if(k==="elo")return r.elo;const s=r[v];return s&&s[k]!=null?s[k]:null};
  const boardRanks=new Map((T.lb?.users||[]).map((u,i)=>[u.nickname.toLowerCase(),{i,elo:u.seasonResult?.eloRate??u.eloRate}]));
  const sorted=rows.slice().sort((a,b)=>{if(k==="elo"&&v==="season"){const x=boardRanks.get(a.name.toLowerCase()),y=boardRanks.get(b.name.toLowerCase());return d*((x?.elo??-Infinity)-(y?.elo??-Infinity))||(x?.i??0)-(y?.i??0)}const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;if(typeof x==="string")return d*x.localeCompare(y);return d*(x-y)});
  const lead=key=>{const a=rows.map(r=>r[v]&&r[v][key]).filter(x=>x!=null&&x>0);return a.length?Math.min(...a):null};
  const bpb=lead("pb"),bavg=lead("avg");
  const cols=[["name","Player",""],["elo","Elo","num"],["wr","Win rate","num"],["games","Matches","num"],["wins","Wins","num"],["pb","PB","num"],["avg","Average","num"]];
  el.innerHTML=`<table class="pt2" style="min-width:700px"><thead><tr><th>#</th>${cols.map(c=>`<th class="${c[2]}" data-k="${c[0]}">${c[1]}${k===c[0]?(d<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>${sorted.map((r,i)=>{
    const s=r[v]||{},bad=r.state!=="d",wait=`<span class="mut">${r.state==="e"?"×":"…"}</span>`;
    const c=(x,f,cls)=>`<td class="num ${cls||""}">${bad?wait:x!=null?f(x):"—"}</td>`;
    return `<tr><td class="mut">${i+1}</td><td><span class="who">${flag(r.country)?`<span title="${esc(cname(r.country))}">${flag(r.country)}</span>`:""}<img class="head" alt="" width="24" height="24" loading="lazy" src="https://mc-heads.net/avatar/${enc(r.uuid||r.name)}/24"><a href="#${enc(r.name)}">${esc(r.name)}</a>${r.uuid?profileDecoration({uuid:r.uuid}):""}</span></td>`+
      `<td class="num"><span class="who">${bad?wait:icon(r.elo,22)+(r.elo!=null?r.elo:"—")}</span></td>`+
      c(s.wr,x=>x.toFixed(1)+"%")+c(s.games,x=>x)+c(s.wins,x=>x)+
      c(s.pb,fmtP,s.pb!=null&&s.pb===bpb?"best":"")+c(s.avg,fmtP,s.avg!=null&&s.avg===bavg?"best":"")+`</tr>`}).join("")}</tbody></table>`;
  const done=rows.filter(r=>r.state==="d"||r.state==="e").length;
  const ps=$("pstat");if(ps)ps.textContent=done+" / "+names.length+" players loaded";
  const se=$("lbsent");if(se)se.textContent=T.lb&&T.shown>=T.lb.users.length?"End of leaderboard · "+T.lb.users.length+" players":"Loading more…";
}

/* ---------- global events ---------- */
const out=$("out");
out.addEventListener("change",async e=>{
  if(e.target.id==="lbseason")go("#!lb/"+e.target.value);
  if(e.target.id==="lbcountry"){
    T.country=e.target.value;T.shown=20;
    showLeaderboard(T.view);
  }
  if(e.target.id==="profileSeason"&&P&&P.u){
    const season=Number(e.target.value),tok=P;
    P.profileSeason=String(season);
    if(season===T.currentSeason){
      P.u=P.baseUser;
      const mk=()=>({list:[],done:false,p:null,err:null});
      P.st={ranked:mk(),private:mk(),casual:mk()};P.full=false;P.matchSort="recent";
      renderProfile();return
    }
    const area=$("tiles");if(area)area.innerHTML='<div class="msg">Loading Season '+season+' profile and matches…</div>';
    try{
      // The user endpoint, unlike the leaderboard endpoint, contains season-specific
      // statistics (wins, played matches, PB, etc.).
      const user=await get(API+"/users/"+enc(tok.baseUser.uuid)+"?season="+season);
      if(P!==tok||String(P.profileSeason)!==String(season))return;
      if(!user||!user.uuid)throw Error("Season-specific player data unavailable");
      tok.u=user;
      const mk=()=>({list:[],done:false,p:null,err:null});
      tok.st={ranked:mk(),private:mk(),casual:mk()};tok.full=false;tok.matchSort="recent";
      renderProfile();
    }catch(err){if(P===tok&&String(P.profileSeason)===String(season)&&$("tiles"))$("tiles").innerHTML='<div class="msg">'+esc(err.message)+'</div>'}
  }
});
out.addEventListener("change",e=>{if(e.target.id==="matchSort")setMatchSort(e.target.value);if(e.target.id==="matchMode"&&P&&P.st&&MT[e.target.value]!=null&&P.mode!==e.target.value){P.mode=e.target.value;P.matchSort="recent";renderProfile()}});
out.addEventListener("click",e=>{
  const t=e.target;
  const copyBtn=t.closest("[data-copy-discord]");if(copyBtn){
    const username=copyBtn.dataset.copyDiscord||"";
    const copied=()=>{const label=copyBtn.querySelector("[data-discord-label]");if(label){label.textContent="Copied!";setTimeout(()=>{if(label.isConnected)label.textContent=username},1400)}};
    const fallback=()=>{const ta=document.createElement("textarea");ta.value=username;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");copied()}catch(_){}ta.remove()};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(username).then(copied).catch(fallback);else fallback();
    return;
  }
  const op=t.closest("[data-open]");if(op){openMatch(op.dataset.open);return}
  const md=t.closest("[data-pm]");if(md&&P&&P.st){if(P.mode!==md.dataset.pm){P.mode=md.dataset.pm;P.matchSort="recent";renderProfile()}return}
  const g=t.closest("[data-g]");if(g&&P&&P.st){setFull(g.dataset.g==="full");return}
  const th=t.closest("th[data-k]");if(th){const k=th.dataset.k;if(T.sort.k===k)T.sort.d*=-1;else T.sort={k,d:(k==="avg"||k==="pb"||k==="name")?1:-1};(T.historical?renderHistorical():renderPT());return}
  const se=t.closest("#sent");if(se&&se.dataset.retry&&P&&P.st){P.st[P.mode].err=null;loadMore(P.mode);return}
  if(t.closest("a"))return;
  const tr=t.closest("tr.pt");
  if(tr){const id=tr.dataset.id;
    if(P&&P.st&&P.mode==="ranked"){const ix=pts.findIndex(p=>String(p.id)===String(id));if(ix>0)select(ix,false)}
    openMatch(id)}
});
$("modal").addEventListener("click",e=>{
  if(e.target===$("modal")||e.target.closest("[data-close]")){closeModal();return}
  const tr=e.target.closest("tr.sp");
  if(tr){tr.querySelectorAll("td[data-seek]").forEach(td=>seekVod(td.dataset.u,+td.dataset.seek))}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});


// Persistent website settings: font and background.
(()=>{
 const select=document.getElementById('fontChoice');
 const background=document.getElementById('backgroundChoice');
 const wrap=document.getElementById('settingsWrap');
 const toggle=document.getElementById('settingsToggle');
 if(!select||!background||!wrap||!toggle)return;
 const fontKey='mcsr-stats-font',backgroundKey='mcsr-stats-background';
 toggle.addEventListener('click',()=>{const opened=wrap.classList.toggle('open');toggle.setAttribute('aria-expanded',String(opened));});
 document.addEventListener('click',e=>{if(!wrap.contains(e.target)){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){wrap.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
 const originalText=new WeakMap();
 const map={a:'ᔑ',b:'ʖ',c:'ᓵ',d:'↸',e:'ᒷ',f:'⎓',g:'⊣',h:'〒',i:'╎',j:'リ',k:'ꖌ',l:'ꖎ',m:'ᒲ',n:'リ',o:'𝙹',p:'!¡',q:'ᑑ',r:'∷',s:'ᓭ',t:'ℸ',u:'⚍',v:'⍊',w:'∴',x:'̇/',y:'||',z:'⨅'};
 const sga=t=>t.replace(/[a-z]/gi,ch=>{const v=map[ch.toLowerCase()]||ch;return ch===ch.toUpperCase()?v.toUpperCase():v});
 function process(root,mode){
  if(root.nodeType===Node.TEXT_NODE){if(!originalText.has(root))originalText.set(root,root.nodeValue);const original=originalText.get(root);const next=mode==='sga'?sga(original):original;if(root.nodeValue!==next)root.nodeValue=next;return;}
  if(root.nodeType!==Node.ELEMENT_NODE)return;
  if(/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT)$/i.test(root.tagName)||root.closest('#settingsWrap'))return;
  for(const n of root.childNodes)process(n,mode);
 }
 let changing=false;
 const observer=new MutationObserver(records=>{if(changing)return;changing=true;const mode=select.value;for(const r of records){for(const n of r.addedNodes)process(n,mode);if(r.type==='characterData')process(r.target,mode)}changing=false});
 function applyFont(mode){document.body.classList.toggle('font-minecraft',mode==='minecraft');changing=true;process(document.body,mode);changing=false;}
 function applyBackground(mode){document.body.classList.toggle('dark-everything',mode==='dark');}
 select.value=localStorage.getItem(fontKey)||'default';
 background.value=localStorage.getItem(backgroundKey)||'default';
 applyFont(select.value);applyBackground(background.value);
 observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 select.addEventListener('change',()=>{localStorage.setItem(fontKey,select.value);applyFont(select.value)});
 background.addEventListener('change',()=>{localStorage.setItem(backgroundKey,background.value);applyBackground(background.value)});
})();
route();
</script>
