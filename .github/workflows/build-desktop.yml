name: Build and publish Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "package.json"
      - "electron/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RankedStats-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: RankedStats Desktop v1.0.0
          body: |
            Windows installer for RankedStats Desktop.

            Download `RankedStats-Setup-1.0.0.exe` below and run it to install.
          files: dist/*.exe
          overwrite_files: true
          make_latest: true
